name: Build README

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"   # daily, 07:47 IST

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild live sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_readme.py
      - name: Commit if changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "readme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh README live sections"
          git push
